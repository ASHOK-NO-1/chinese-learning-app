<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>學 Xué · Learn Chinese</title>
  <meta name="description" content="Learn Mandarin Chinese from English: notebook vocabulary with pinyin and pronunciation.">
  <meta name="theme-color" content="#B23A2E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pinyin.css">
  <link rel="stylesheet" href="css/listener.css">
  <link rel="stylesheet" href="css/features.css">
  <script>
    // apply saved theme + menu side before first paint (no flash)
    try {
      const s = JSON.parse(localStorage.getItem("xue.settings") || "{}");
      if (s.theme && s.theme !== "auto") document.documentElement.dataset.theme = s.theme;
      if (s.navSide) document.documentElement.dataset.navSide = s.navSide;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <button class="brand" id="brand" type="button" title="Home">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <span class="brand-text">
          <strong>Xué <span lang="zh-Hant">學</span></strong>
          <small>Learn Chinese from English</small>
        </span>
      </button>
      <nav class="nav" id="nav"></nav>
      <nav class="nav nav-footer" id="nav-footer"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="tabs" id="tabs" role="tablist" aria-label="Open pages"></div>
        <button class="icon-btn sync-btn" id="sync-btn" type="button" hidden aria-label="Cloud sync" title="Cloud sync"></button>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light / dark theme" title="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>
      <main class="views" id="views"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
